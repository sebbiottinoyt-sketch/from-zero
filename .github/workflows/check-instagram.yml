name: Prova Instagram

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Prova il collegamento
        run: python automation/check_ig.py
